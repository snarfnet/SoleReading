name: SoleReading
options:
  bundleIdPrefix: com.yourcompany
  deploymentTarget:
    iOS: "16.0"
  defaultConfig: Release

configs:
  Debug: debug
  Release: release

targets:
  SoleReading:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: SoleReading
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amasaki.SoleReading
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 2
        INFOPLIST_FILE: SoleReading/Info.plist
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_TEAM: 83VGKGSQUH
        CODE_SIGN_STYLE: Automatic
    info:
      path: SoleReading/Info.plist
